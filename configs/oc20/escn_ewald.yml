fixed:
  name: escn_oc20_ewald

  dataset_train:
    - src: ./data/s2ef/2M/train
      normalize_labels: True
      target_mean: -0.7554450631141663
      target_std: 2.887317180633545
      grad_target_mean: 0.0
      grad_target_std: 2.887317180633545
    - src: ./data/s2ef/all
      subsampling_fraction: 0.001

  dataset_id:
    - src: ./data/s2ef/2M/train
      normalize_labels: True
      target_mean: -0.7554450631141663
      target_std: 2.887317180633545
      grad_target_mean: 0.0
      grad_target_std: 2.887317180633545
    - src: ./data/s2ef/all/val_id/
      subsampling_fraction: 0.001

  logger: tensorboard

  task:
    dataset: trajectory_lmdb
    description: "Regressing to energies and forces for DFT trajectories from OCP"
    type: regression
    metric: mae
    labels:
      - potential energy
    grad_input: atomic forces
    train_on_free_atoms: True
    eval_on_free_atoms: True

  model:
    name: escn
    hidden_channels: 256
    num_layers: 8
    cutoff: 6.0
    max_neighbors: 20
    ######################################### Ewald message passing hyperparameters
    ewald_hyperparams:
      num_k_x: 1
      num_k_y: 1
      num_k_z: 3
      downprojection_size: 8
      num_hidden: 0
    #########################################
    regress_forces: True
    otf_graph: True
    use_pbc: True
    use_ewald: True

  optimizer:
    batch_size: 2
    eval_batch_size: 2
    eval_every: 20000
    num_workers: 0
    optimizer: AdamW
    optimizer_params: {"amsgrad": True}
    lr_initial: 1.e-4
    lr_gamma: 0.8
    scheduler: ReduceLROnPlateau
    mode: min
    factor: 0.8
    patience: 3
    max_epochs: 12
    force_coefficient: 100
    energy_coefficient: 1
    ema_decay: 0.999
    clip_grad_norm: 10
    loss_energy: mae
    loss_force: mae
    weight_decay: 0
