# MD22 eSCN-MD Irreps Training Configuration
# Configuration for training eSCN-MD Irreps model with Ewald blocks on MD22 dataset

# Data settings
data:
  root: "./data/MD22"  # Root directory for MD22 dataset
  molecule: "buckyball_catcher"  # Molecule name
  seed: 7  # Random seed

# Model architecture - eSCN-MD Irreps specific
model:
  num_elements: 90  # Maximum atomic number
  sphere_channels: 128  # Number of spherical channels
  hidden_channels: 128  # Hidden layer size
  edge_channels: 128  # Edge embedding size
  lmax: 3  # Maximum angular momentum
  mmax: 2  # Maximum m quantum number
  num_layers: 3  # Number of message passing layers
  cutoff: 4.0  # Cutoff radius in Angstroms
  max_neighbors: 50  # Maximum number of neighbors

  irreps: true  # Enable Ewald blocks for irreps model
  # Ewald block parameters (set to null to disable)
  # Enable by setting parameters or passing --use-ewald flag
  ewald_hyperparams:
    # num_k_x: 1  # k-space x range
    # num_k_y: 1  # k-space y range
    # num_k_z: 3  # k-space z range
    # downprojection_size: 8  # Down-projection dimension
    # num_hidden: 1  # Number of hidden layers in MLP
    k_cutoff: 0.6
    delta_k: 0.2
    num_k_rbf: 128
    downprojection: 8
    num_hidden: 3


# Training settings
training:
  epochs: 1000  # Total training epochs
  batch_size: 4  # Training batch size
  eval_batch_size: 4  # Evaluation batch size
  lr: 0.0002  # Learning rate
  weight_decay: 0.0  # Weight decay
  lr_factor: 0.8  # LR reduction factor
  lr_patience: 8  # Patience for LR reduction
  lr_min: 1.0e-7  # Minimum learning rate
  clip_grad: 100.0  # Gradient clipping
  energy_weight: 1  # Energy loss weight
  force_weight: 100  # Force loss weight
  print_freq: 1  # Print frequency

# Output settings
output:
  base_dir: "./runs/md22_escn_md_irreps/test_irreps"  # Base output directory
  ckpt_dir: "checkpoints"  # Checkpoint subdirectory
  log_dir: "logs"  # Log subdirectory
  save_last: true  # Save last epoch

# System settings
system:
  cuda: true  # Use CUDA
  num_workers: 4  # Data loading workers
  deterministic: true  # Deterministic mode
  gpus: [0]  # GPU IDs to use
  distributed: true  # Enable DDP
  dist_backend: "nccl"  # Distributed backend
  find_unused_parameters: false  # For DDP
